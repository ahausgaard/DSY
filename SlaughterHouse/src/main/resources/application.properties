spring.application.name=SlaughterHouse

spring.datasource.url=jdbc:postgresql://localhost:5432/slaughterhouse
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=slaughterhouse

spring.grpc.server.port=9090

# RabbitMQ (docker-compose in the DSY root, guest/guest)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
# A message the server can't register (e.g. unknown delivery) is dropped, not redelivered forever
spring.rabbitmq.listener.simple.default-requeue-rejected=false
