spring.application.name=SlaughterHouse

# Local PostgreSQL. The password is read from the DB_PASSWORD environment variable,
# set it in the IntelliJ run configuration so it stays out of git
spring.datasource.url=jdbc:postgresql://localhost:5432/slaughterhouse
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# The tables come from db/schema.sql; Hibernate only checks that the entities match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=slaughterhouse

spring.grpc.server.port=9090
